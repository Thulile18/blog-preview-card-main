<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-container">

    <div class="login-card">

        <h1>Welcome Back</h1>

        <p class="subtitle">
            Log in to access your developer membership.
        </p>

        <form id="loginForm">

            <div class="input-group">
                <label>Email Address</label>
                <input type="email"
                       placeholder="john@example.com"
                       required>
            </div>

            <div class="input-group">
                <label>Password</label>
                <input type="password"
                       placeholder="••••••••"
                       required>
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <p class="signup-link">
            Don't have an account?
            <a href="signup.html">Create One</a>
        </p>

    </div>

</div>

<script src="login.js"></script>

</body>
</html>
