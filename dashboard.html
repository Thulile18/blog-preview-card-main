<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Dashboard</title>

    <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="dashboard.css">
</head>
<body>

    <aside class="sidebar">

        <h2>DevHub</h2>

        <nav>
            <a href="#">Dashboard</a>
            <a href="#">Tutorials</a>
            <a href="#">Code Reviews</a>
            <a href="#">Community</a>
            <a href="#">Resources</a>
            <a href="#">Settings</a>
        </nav>

        <button class="logout-btn">
            Logout
        </button>

    </aside>

    <main class="main-content">

<header class="topbar">

    <div>
        <h1>Welcome Back 👋</h1>
        <p class="welcome-text">
            Continue where you left off.
        </p>
    </div>

    <div class="profile-section">

        <div class="notification">
            🔔
            <span class="notification-badge">3</span>
        </div>

        <img
            src="https://i.pravatar.cc/150?img=12"
            alt="Profile"
            class="profile-avatar">

    </div>

</header>

        <section class="cards">

            <div class="card">
                <h3>Membership</h3>
                <p>Premium Plan</p>
            </div>

            <div class="card">
                <h3>Tutorials Completed</h3>
                <p>24</p>
            </div>

            <div class="card">
                <h3>Code Reviews</h3>
                <p>8 Pending</p>
            </div>

        </section>

        <section class="recent-content">

            <h2>Latest Tutorials</h2>

            <div class="tutorial-list">

                <div class="tutorial">
                    JavaScript ES2026 Essentials
                </div>

                <div class="tutorial">
                    Advanced CSS Grid Layouts
                </div>

                <div class="tutorial">
                    Building APIs with Node.js
                </div>

            </div>

        </section>

    </main>

<script src="dashboard.js"></script>

</body>
</html>
